server:
  port: 8080

spring:
  application:
    name: library-backend
  # 기본 프로필: 설치 없이 구동되는 H2 인메모리 DB (PostgreSQL 호환 모드)
  # 컨텍스트마다 DB 이름을 달리해 테스트 컨텍스트 간 시드 중복 적재를 막는다
  datasource:
    url: jdbc:h2:mem:library-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  # 스키마·시드는 schema.sql / data.sql 로 관리한다
  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul

app:
  # 권한 캐시용 Hazelcast(embedded). 멀티캐스트·자동 탐지는 끄고 TCP/IP 멤버 목록으로 클러스터를 구성한다.
  # 오픈소스 Hazelcast 는 멤버 인증이 없으므로 반드시 사설망·방화벽 뒤에 둔다(공개 인터페이스 바인딩은 기동 시 거부).
  hazelcast:
    cluster-name: ${HAZELCAST_CLUSTER:library}
    port: ${HAZELCAST_PORT:5701}
    members: ${HAZELCAST_MEMBERS:127.0.0.1}
    # 바인딩 인터페이스. 기본은 루프백(단일 노드)이고, 다중 노드는 사설 대역 주소(예: 10.0.0.*)로 바꾼다.
    interface: ${HAZELCAST_INTERFACE:127.0.0.1}
    # 권한 변경 evict 가 누락되더라도 오래된 값이 무기한 남지 않도록 하는 안전장치(초)
    time-to-live-seconds: 600
  # 날짜·시간 판정(대출 기한, 접속 조건)에 쓰는 시간대
  zone-id: Asia/Seoul
  security:
    # 연속 로그인 실패 허용 횟수(도달 시 잠금, 관리자가 해제)
    max-login-attempts: 5
    login:
      # 클라이언트 IP 당 1분 동안 허용하는 로그인 실패 횟수(도달 시 그 분 동안 429 TOO_MANY_REQUESTS)
      max-failures-per-minute: ${LOGIN_MAX_FAILURES_PER_MINUTE:30}
    # X-Forwarded-For 를 신뢰할 프록시 IP·CIDR (비어 있으면 항상 remoteAddr 사용)
    trusted-proxies: ${TRUSTED_PROXIES:}
    api-key:
      # 존재하지 않는 API Key 해시를 음성 캐시에 두는 시간(그동안 같은 키로 DB 를 다시 조회하지 않는다)
      negative-cache-ttl: ${API_KEY_NEGATIVE_CACHE_TTL:60s}
      # 클라이언트 IP 당 1분 동안 허용하는 API Key 인증 실패 횟수(초과 시 429 TOO_MANY_REQUESTS)
      max-failures-per-minute: ${API_KEY_MAX_FAILURES_PER_MINUTE:20}
  jwt:
    # 서명 키(Base64, 디코드 32바이트 이상). 기본값이 없어 환경 변수 JWT_SECRET 을 주지 않으면 기동에 실패한다.
    # 개발용 키는 기본(H2) 개발 프로필 전용 파일(application-default.yml)에만 둔다.
    secret: ${JWT_SECRET:}
    dev-secret-allowed: false
    issuer: library-backend
    access-token-ttl: 15m
    refresh-token-ttl: 7d
