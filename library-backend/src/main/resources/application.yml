server:
  port: 8080

spring:
  application:
    name: library-backend
  # 기본 프로필: 설치 없이 구동되는 H2 인메모리 DB (PostgreSQL 호환 모드)
  datasource:
    url: jdbc:h2:mem:library;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  # 스키마·시드는 schema.sql / data.sql 로 관리한다
  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul
